# UsbGames on Netlify — static site here; checkout API on Render (or similar).
# See checkout/DEPLOY-NETLIFY.txt

[build]
  publish = "."

# After you deploy checkout/ to Render, uncomment and set YOUR render URL:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-APP.onrender.com/api/:splat"
#   status = 200
#   force = true

# Block direct access to secrets and game zips (downloads only via /api/download after payment)
[[redirects]]
  from = "/checkout/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/checkout/downloads/*"
  to = "/store.html"
  status = 302
