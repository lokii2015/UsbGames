# Deploy: connect repo at https://dashboard.render.com → New Web Service → use this file
# Root directory: checkout (or set in dashboard)
services:
  - type: web
    name: usbgames-checkout
    runtime: node
    rootDir: checkout
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"
